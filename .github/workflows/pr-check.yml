name: PR Quality & Ritual Gate

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Build & Ritual Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Strict ESLint
        run: npm run lint

      - name: Production Vite build
        run: npm run build

      - name: Verify closeout ritual, Hot Context budget & secret scan
        run: npm run check:ci
