<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F3"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FCFAF7"/>
    </linearGradient>
    <linearGradient id="fabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="1280" fill="url(#bgGrad)"/>

  <!-- Top App Bar -->
  <g transform="translate(0, 0)">
    <rect width="720" height="100" fill="#FFFFFF" opacity="0.9" filter="url(#shadow)"/>
    <text x="40" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#1E293B">🌿 Diary</text>
    <rect x="150" y="38" width="100" height="32" rx="16" fill="#EEF2FF"/>
    <text x="170" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#4F46E5">🔒 E2EE</text>
    <circle cx="660" cy="50" r="24" fill="#E0E7FF"/>
    <text x="650" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20">🌸</text>
  </g>

  <!-- Greeting Card -->
  <g transform="translate(40, 130)">
    <rect width="640" height="160" rx="24" fill="url(#cardGrad1)" filter="url(#shadow)"/>
    <text x="32" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#1E293B">Good Morning, Explorer ✨</text>
    <text x="32" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#64748B">How is your spirit today? Capture your thoughts safely.</text>
    <!-- Mood pills -->
    <g transform="translate(32, 105)">
      <circle cx="20" cy="18" r="22" fill="#FEF3C7"/>
      <text x="9" y="26" font-size="20">😊</text>
      <circle cx="80" cy="18" r="22" fill="#DBEAFE"/>
      <text x="69" y="26" font-size="20">🌿</text>
      <circle cx="140" cy="18" r="22" fill="#FEE2E2"/>
      <text x="129" y="26" font-size="20">💭</text>
      <circle cx="200" cy="18" r="22" fill="#EDE9FE"/>
      <text x="189" y="26" font-size="20">✨</text>
      <circle cx="260" cy="18" r="22" fill="#F1F5F9"/>
      <text x="249" y="26" font-size="20">⚡</text>
    </g>
  </g>

  <!-- Personal Tasks Focus Strip -->
  <g transform="translate(40, 315)">
    <rect width="640" height="130" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="30" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#1E293B">🎯 Today's Sanctuary Focus</text>
    <g transform="translate(30, 60)">
      <rect width="280" height="46" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
      <circle cx="24" cy="23" r="10" fill="#10B981"/>
      <text x="44" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#334155" font-weight="500">Morning meditation</text>
      
      <rect x="300" y="0" width="280" height="46" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
      <circle cx="324" cy="23" r="10" fill="#E2E8F0"/>
      <text x="344" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#334155" font-weight="500">Reflect on weekly wins</text>
    </g>
  </g>

  <!-- Diary Entry Cards -->
  <!-- Entry 1 -->
  <g transform="translate(40, 470)">
    <rect width="640" height="230" rx="24" fill="url(#cardGrad1)" stroke="#E0E7FF" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="32" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#1E293B">Dawn Walk in the Pines</text>
    <text x="540" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">Today</text>
    <text x="32" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#475569" width="580">
      The morning mist hung low over the canopy. A quiet stillness enveloped the trail, offering a moment of true clarity before the day began...
    </text>
    <g transform="translate(32, 160)">
      <rect width="90" height="30" rx="8" fill="#ECFDF5"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#059669">🌿 Nature</text>
      <rect x="100" y="0" width="110" height="30" rx="8" fill="#EEF2FF"/>
      <text x="114" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#4F46E5">✨ Reflection</text>
      <text x="540" y="22" font-size="18">😊</text>
    </g>
  </g>

  <!-- Entry 2 -->
  <g transform="translate(40, 725)">
    <rect width="640" height="230" rx="24" fill="url(#cardGrad1)" stroke="#F1F5F9" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="32" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#1E293B">New Breakthrough on Architecture</text>
    <text x="520" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">Yesterday</text>
    <text x="32" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#475569">
      Zero-knowledge encryption layer finalized. With AES-256-GCM and partitioned local caches, private data remains truly private across devices.
    </text>
    <g transform="translate(32, 160)">
      <rect width="100" height="30" rx="8" fill="#FEF3C7"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#D97706">🔒 Security</text>
      <rect x="110" y="0" width="90" height="30" rx="8" fill="#F1F5F9"/>
      <text x="124" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#475569">💻 Tech</text>
      <text x="540" y="22" font-size="18">🚀</text>
    </g>
  </g>

  <!-- Floating Action Button -->
  <g transform="translate(560, 1050)" filter="url(#shadow)">
    <circle cx="45" cy="45" r="45" fill="url(#fabGrad)"/>
    <text x="32" y="55" font-size="36" font-weight="300" fill="#FFFFFF">+</text>
  </g>

  <!-- Bottom Navigation -->
  <g transform="translate(0, 1170)">
    <rect width="720" height="110" fill="#FFFFFF" filter="url(#shadow)"/>
    <g transform="translate(70, 30)">
      <text x="0" y="22" font-size="24" fill="#4F46E5">📖</text>
      <text x="-6" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#4F46E5">Journal</text>
    </g>
    <g transform="translate(230, 30)">
      <text x="0" y="22" font-size="24">📅</text>
      <text x="-8" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">Calendar</text>
    </g>
    <g transform="translate(410, 30)">
      <text x="0" y="22" font-size="24">⚡</text>
      <text x="-4" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">Tasks</text>
    </g>
    <g transform="translate(580, 30)">
      <text x="0" y="22" font-size="24">⚙️</text>
      <text x="-6" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">Profile</text>
    </g>
  </g>
</svg>
