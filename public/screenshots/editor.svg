<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="deskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F3"/>
      <stop offset="100%" stop-color="#F5F0E8"/>
    </linearGradient>
    <filter id="deskShadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="720" fill="url(#deskBg)"/>

  <!-- Left Sidebar (Desktop) -->
  <g transform="translate(0, 0)">
    <rect width="260" height="720" fill="#FFFFFF" stroke="#F1EFEA" stroke-width="1"/>
    
    <!-- App Brand -->
    <g transform="translate(32, 40)">
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#1E293B">🌿 Diary</text>
      <rect x="100" y="4" width="70" height="24" rx="12" fill="#ECFDF5"/>
      <text x="110" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#059669">v1.0.19</text>
    </g>

    <!-- Navigation Items -->
    <g transform="translate(20, 110)">
      <!-- Timeline Link -->
      <rect width="220" height="44" rx="12" fill="transparent"/>
      <text x="18" y="28" font-size="18">📖</text>
      <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#64748B">Timeline</text>

      <!-- Active Editor Button -->
      <g transform="translate(0, 56)">
        <rect width="220" height="44" rx="12" fill="#EEF2FF"/>
        <text x="18" y="28" font-size="18">✍️</text>
        <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#4F46E5">New Entry</text>
      </g>

      <!-- Tasks Link -->
      <g transform="translate(0, 112)">
        <rect width="220" height="44" rx="12" fill="transparent"/>
        <text x="18" y="28" font-size="18">⚡</text>
        <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#64748B">Sanctuary Tasks</text>
      </g>

      <!-- Calendar Link -->
      <g transform="translate(0, 168)">
        <rect width="220" height="44" rx="12" fill="transparent"/>
        <text x="18" y="28" font-size="18">📅</text>
        <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#64748B">Calendar</text>
      </g>

      <!-- Search Link -->
      <g transform="translate(0, 224)">
        <rect width="220" height="44" rx="12" fill="transparent"/>
        <text x="18" y="28" font-size="18">🔍</text>
        <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#64748B">Search Archive</text>
      </g>
    </g>

    <!-- Bottom Profile Widget -->
    <g transform="translate(20, 640)">
      <circle cx="24" cy="24" r="20" fill="#E0E7FF"/>
      <text x="15" y="31" font-size="16">🌸</text>
      <text x="56" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1E293B">Zero-Knowledge</text>
      <text x="56" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#10B981">● Vault Unlocked</text>
    </g>
  </g>

  <!-- TopBar (Desktop) -->
  <g transform="translate(260, 0)">
    <rect width="1020" height="70" fill="#FFFFFF" stroke="#F1EFEA" stroke-width="1"/>
    
    <!-- Weather Widget -->
    <g transform="translate(40, 20)">
      <rect width="180" height="32" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="14" y="22" font-size="16">⛅</text>
      <text x="38" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#334155">22°C • New Delhi</text>
    </g>

    <!-- Save & Encrypt Button -->
    <g transform="translate(860, 16)">
      <rect width="120" height="38" rx="10" fill="#4F46E5"/>
      <text x="24" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Save Entry</text>
    </g>
  </g>

  <!-- Main Editor Canvas -->
  <g transform="translate(320, 100)">
    <rect width="900" height="580" rx="20" fill="#FFFFFF" filter="url(#deskShadow)"/>

    <!-- Editor Meta Header -->
    <g transform="translate(50, 45)">
      <!-- Date Picker Mock -->
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748B">MONDAY, NOVEMBER 16, 2026</text>
      
      <!-- Mood Selector -->
      <g transform="translate(680, 0)">
        <rect width="120" height="32" rx="16" fill="#FEF3C7"/>
        <text x="14" y="21" font-size="16">😊</text>
        <text x="38" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#B45309">Peaceful</text>
      </g>
    </g>

    <!-- Entry Title Input -->
    <g transform="translate(50, 110)">
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#0F172A">Morning Light &amp; Intentional Solitude</text>
      <line x1="0" y1="48" x2="800" y2="48" stroke="#F1F5F9" stroke-width="2"/>
    </g>

    <!-- Quill Editor Content Mock -->
    <g transform="translate(50, 190)">
      <text x="0" y="20" font-family="Georgia, serif" font-size="18" fill="#334155" line-height="1.6">
        There is a subtle cadence to early mornings before notifications intrude upon consciousness.
      </text>
      <text x="0" y="60" font-family="Georgia, serif" font-size="18" fill="#334155">
        With the windows cracked open, the crisp autumn air flows steadily across the room.
      </text>
      <text x="0" y="100" font-family="Georgia, serif" font-size="18" fill="#334155">
        Writing here feels completely serene. Knowing that every thought is client-side encrypted
      </text>
      <text x="0" y="140" font-family="Georgia, serif" font-size="18" fill="#334155">
        before touching remote storage brings deep peace of mind.
      </text>
    </g>

    <!-- Tags & Audio Pills -->
    <g transform="translate(50, 500)">
      <rect width="110" height="32" rx="16" fill="#EEF2FF"/>
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#4F46E5">🌿 Mindful</text>
      
      <rect x="120" y="0" width="110" height="32" rx="16" fill="#F0FDF4"/>
      <text x="134" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#16A34A">☕ Morning</text>

      <rect x="240" y="0" width="140" height="32" rx="16" fill="#FFF1F2"/>
      <text x="254" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E11D48">🎙️ Voice Note (1)</text>

      <g transform="translate(680, 6)">
        <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#10B981">✓ Auto-saved encrypted draft</text>
      </g>
    </g>
  </g>
</svg>
